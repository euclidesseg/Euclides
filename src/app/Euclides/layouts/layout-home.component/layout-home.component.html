<!-- NAVBAR -->
<div class="fixed top-0 left-0 right-0 z-200 px-8 pt-3 pb-2">
  <nav
    class="max-w-6xl mx-auto h-14 flex items-center justify-between px-6 py-2 bg-brand-navy-300/80 backdrop-blur-xl border border-brand-navy-200 rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.25)]">

    <a [routerLink]="'/about'" routerLinkActive="text-accent border-b-2 border-accent"
      [routerLinkActiveOptions]="{ exact: true }"
      class="relative text-brand-golden-300 flex items-center font-medium h-full px-4 transition-colors duration-300 hover:text-brand-golden-400">
      <i class="ph ph-user-circle text-lg mr-2"></i>
      <span>{{ 'Euclides' | uppercase }}</span>
    </a>

    @for (route of routes(); track route.path) {
    <a [routerLink]="route.path" routerLinkActive="border-b-2 border-brand-golden-300 text-brand-golden-300"
      [routerLinkActiveOptions]="{ exact: true }"
      class="px-3 py-1.5 text-[11px] font-medium uppercase tracking-[0.12em] transition-all relative hover:text-brand-golden-200 ">
      <span>{{ route.label | uppercase }}</span>
    </a>
    }

  </nav>
</div>

<!-- MAIN -->
<main class="h-full w-full max-w-7xl relative px-4 lg:px-6 flex justify-center items-center mx-auto">
  <router-outlet></router-outlet>
</main>

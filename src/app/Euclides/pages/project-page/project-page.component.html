<div class="max-w-6xl mx-auto py-4">
    <!-- Encabezado de la Sección -->
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-6">
        <div class="max-w-2xl">
            <div class="flex items-center gap-2 mb-4">
                <span class="w-12 h-1 bg-brand-main rounded-full"></span>
                <span class="text-brand-main font-bold tracking-widest uppercase text-xl">Proyectos personales</span>
            </div>
            <h2 class="text-4xl md:text-5xl font-black text-slate-900 leading-tight">
                Experiencia <span class="text-brand-main">Individual</span>
            </h2>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (project of projects(); track project.id) {

        <div class="relative p-1 rounded-2xl overflow-hidden border border-brand-gray bg-white 
                transition duration-300 hover:shadow-lg flex flex-col h-full">

            <div class="flex flex-col h-full">

                <!-- Imagen -->
                <div class="relative group">
                    <img [src]="project.imageCover"
                        class="w-full h-48 object-cover rounded-lg transition-transform duration-700 group-hover:scale-[1.03]"
                        alt="Proyecto">
                </div>

                <!-- Contenido -->
                <div class="p-4 flex flex-col flex-grow">

                    <h3 class="text-xl font-bold text-slate-900 mb-2">
                        {{project.title}}
                    </h3>

                    <p class="text-slate-600 mb-4 text-sm leading-relaxed flex-grow">
                        {{project.shortDescription}}
                    </p>

                    <div class="flex flex-wrap gap-2 mb-4">
                        @for (tech of project.technologies; track tech) {
                        <span
                            class="text-xs font-semibold px-3 py-1 bg-slate-100 text-slate-500 rounded-full border border-slate-200">
                            {{tech}}
                        </span>
                        }
                    </div>

                </div>

                <!-- Footer (SIEMPRE ABAJO) -->
                <div class="border-t border-slate-200 p-3 mt-auto">
                    <a [href]="project.demoUrl" class="text-slate-700 w-full
                    px-4 py-2 bg-slate-100 rounded-lg font-semibold 
                    text-sm flex items-center justify-between gap-2 
                    transition-all duration-300 hover:bg-slate-200 group"
                        [routerLink]="['/euclides/projects', project.title]">

                        <span>Detalles</span>

                        <span class="w-7 h-7 rounded-lg border border-slate-200 flex items-center justify-center 
                         transition-all duration-300 group-hover:scale-110 group-hover:border-slate-400">
                            →
                        </span>
                    </a>
                </div>

            </div>
        </div>
        }
    </div>
</div>

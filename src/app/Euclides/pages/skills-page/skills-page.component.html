<section class="ep-skills w-full px-6 md:px-10 lg:px-14 pt-16 font-space">
  <div class="w-full max-w-6xl mx-auto min-h-screen mt-26 py-16 lg:mt-4">
    <div class="ep-skills__title-content w-full">
      <h2 class="ep-skills__title text-xl md:text-2xl lg:text-4xl">Habilidades</h2>
      <div class="ep-skills__line border w-full h-px h-.5 opacity-[0.05] border-brand-golden-100"></div>
    </div>
    <div class="max-w-full">
      <app-feel-component/>   
    </div>
    
    
    <div class="e-skills__content font-code">
      <section class="w-full p-4 border border-brand-navy-200/50 rounded-lg flex gap-2.5 items-end justify-end flex-col ">
        <div class="w-full lg:w-1/2 mr-0 flex items-center justify-between gap-1.5 p-2 border border-brand-golden-200/5 rounded-lg px-8">
          <div class="px-2 py-1.5 border border-brand-golden-200/5 rounded-xl text-brand-golden-100 transition-colors duration-500 bg-brand-golden-300/5 hover:bg-brand-golden-300 hover:text-brand-navy-400 cursor-pointer font-inter">Todas</div>
          <div class="px-2 py-1.5 border border-brand-golden-200/5 rounded-xl text-brand-golden-100 transition-colors duration-500 bg-brand-golden-300/5 hover:bg-brand-golden-300 hover:text-brand-navy-400 cursor-pointer font-inter">Lenguajes</div>
          <div class="px-2 py-1.5 border border-brand-golden-200/5 rounded-xl text-brand-golden-100 transition-colors duration-500 bg-brand-golden-300/5 hover:bg-brand-golden-300 hover:text-brand-navy-400 cursor-pointer font-inter">Frontend</div>
          <div class="px-2 py-1.5 border border-brand-golden-200/5 rounded-xl text-brand-golden-100 transition-colors duration-500 bg-brand-golden-300/5 hover:bg-brand-golden-300 hover:text-brand-navy-400 cursor-pointer font-inter">Backend</div>
          <div class="px-2 py-1.5 border border-brand-golden-200/5 rounded-xl text-brand-golden-100 transition-colors duration-500 bg-brand-golden-300/5 hover:bg-brand-golden-300 hover:text-brand-navy-400 cursor-pointer font-inter">Herramientas</div>
        </div>
        <div class="flex w-full items-start justify-evenly sm:justify-center flex-wrap gap-4 py-4">
          @for (skill of skills(); track skill.name) {
             <div 
             class="w-full max-w-36 flex items-center justify-start gap-2.5
                    text-brand-golden-300
                    border border-brand-golden-200/10
                    py-2 px-4 rounded-lg
                    uppercase text-[12px] tracking-wide"
               >
              @if (skill.icon) {
                <svg
                  [attr.viewBox]="'0 0 ' + skill.icon.width + ' ' + skill.icon.height"
                  [innerHTML]="skill.icon.body"
                  class="w-5 h-5 shrink-0"
                  aria-hidden="true"
                ></svg>
              }

              <span>{{ skill.name }}</span>
            </div>
          } 
          <div class="w-full max-w-36 flex items-center justify-start gap-2.5 text-brand-golden-300 border border-brand-golden-200/10 py-2 px-4 rounded-lg uppercase text-[12px] tracking-wide">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 16 16">
              <path d="M0 0h16v16H0z" fill="none" />
              <path fill="#ffca28" d="M2 2v12h12V2zm6 6h1v4a1.003 1.003 0 0 1-1 1H7a1.003 1.003 0 0 1-1-1v-1h1v1h1zm3 0h2v1h-2v1h1a1.003 1.003 0 0 1 1 1v1a1.003 1.003 0 0 1-1 1h-2v-1h2v-1h-1a1.003 1.003 0 0 1-1-1V9a1.003 1.003 0 0 1 1-1" />
            </svg>
            <span>JavaScript</span>
          </div>
          <div class="w-full max-w-36 flex items-center justify-start gap-2.5 text-brand-golden-300 border border-brand-golden-200/10 py-2 px-4 rounded-lg uppercase text-[12px] tracking-wide">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 16 16">
              <path d="M0 0h16v16H0z" fill="none" />
              <path fill="#0288d1" d="M2 2v12h12V2zm4 6h3v1H8v4H7V9H6zm5 0h2v1h-2v1h1a1.003 1.003 0 0 1 1 1v1a1.003 1.003 0 0 1-1 1h-2v-1h2v-1h-1a1.003 1.003 0 0 1-1-1V9a1.003 1.003 0 0 1 1-1" />
            </svg>
            <span>TypeScript</span>
          </div>
          <div class="w-full max-w-36 flex items-center justify-start gap-2.5 text-brand-golden-300 border border-brand-golden-200/10 py-2 px-4 rounded-lg uppercase text-[12px] tracking-wide">
           <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 128 128">
            <path d="M0 0h128v128H0z" fill="none" />
            <linearGradient id="SVGtryZab8W" x1="70.252" x2="170.659" y1="1237.476" y2="1151.089" gradientTransform="matrix(.563 0 0 -.568 -29.215 707.817)" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#5a9fd4" />
              <stop offset="1" stop-color="#306998" />
            </linearGradient>
            <linearGradient id="SVGe9yX9dAA" x1="209.474" x2="173.62" y1="1098.811" y2="1149.537" gradientTransform="matrix(.563 0 0 -.568 -29.215 707.817)" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffd43b" />
              <stop offset="1" stop-color="#ffe873" />
            </linearGradient>
            <path fill="url(#SVGtryZab8W)" d="M63.391 1.988c-4.222.02-8.252.379-11.8 1.007c-10.45 1.846-12.346 5.71-12.346 12.837v9.411h24.693v3.137H29.977c-7.176 0-13.46 4.313-15.426 12.521c-2.268 9.405-2.368 15.275 0 25.096c1.755 7.311 5.947 12.519 13.124 12.519h8.491V67.234c0-8.151 7.051-15.34 15.426-15.34h24.665c6.866 0 12.346-5.654 12.346-12.548V15.833c0-6.693-5.646-11.72-12.346-12.837c-4.244-.706-8.645-1.027-12.866-1.008M50.037 9.557c2.55 0 4.634 2.117 4.634 4.721c0 2.593-2.083 4.69-4.634 4.69c-2.56 0-4.633-2.097-4.633-4.69c-.001-2.604 2.073-4.721 4.633-4.721" transform="translate(0 10.26)" />
            <path fill="url(#SVGe9yX9dAA)" d="M91.682 28.38v10.966c0 8.5-7.208 15.655-15.426 15.655H51.591c-6.756 0-12.346 5.783-12.346 12.549v23.515c0 6.691 5.818 10.628 12.346 12.547c7.816 2.297 15.312 2.713 24.665 0c6.216-1.801 12.346-5.423 12.346-12.547v-9.412H63.938v-3.138h37.012c7.176 0 9.852-5.005 12.348-12.519c2.578-7.735 2.467-15.174 0-25.096c-1.774-7.145-5.161-12.521-12.348-12.521h-9.268zM77.809 87.927c2.561 0 4.634 2.097 4.634 4.692c0 2.602-2.074 4.719-4.634 4.719c-2.55 0-4.633-2.117-4.633-4.719c0-2.595 2.083-4.692 4.633-4.692" transform="translate(0 10.26)" />
            <radialGradient id="SVGda693d3X" cx="1825.678" cy="444.45" r="26.743" gradientTransform="matrix(0 -.24 -1.055 0 532.979 557.576)" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#b8b8b8" stop-opacity=".498" />
              <stop offset="1" stop-color="#7f7f7f" stop-opacity="0" />
            </radialGradient>
            <path fill="url(#SVGda693d3X)" d="M97.309 119.597c0 3.543-14.816 6.416-33.091 6.416c-18.276 0-33.092-2.873-33.092-6.416s14.815-6.417 33.092-6.417c18.275 0 33.091 2.872 33.091 6.417" opacity=".444" />
          </svg>

            <span>Python</span>
          </div>
        </div>
      </section>
    </div>
  </div>
</section>

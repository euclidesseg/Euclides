@if (sidebarState() == true) {
    <aside
        class="ep-sidebar lg:hidden h-screen w-[80%] sm:w-90 fixed right-0 top-0 bottom-0 z-102 bg-brand-navy-400 border-l border-brand-golden-300/20">
        <header class="ep-sidebar__header relative h-full flex flex-col justify-between pb-4">
            <div
                class="w-full text-brand-golden-300 border-b border-brand-golden-300/20 px-4 uppercase mx-auto flex gap-8 items-center justify-between font-medium text-sm transition-colors duration-300 tracking-widest">
                <div class="flex gap-2 items-center">
                    <div
                        class="group relative flex items-center justify-center gap-2 py-2.5 text-brand-ivory-300 font-medium text-[12px] sm:text-sm text-nowrap transition-colors duration-300"
                        >
                        <div class="relative overflow-hidden border border-brand-steel-300/80 w-10.5 h-10.5 p-1 text-brand-golden-100">
                            <div class="transition-colors duration-500 absolute top-0 left-0 z-10 h-2 w-2 border-0 border-t border-l border-transparent group-hover:border-brand-ivory-300"></div>
                            <div class="transition-colors duration-500 absolute right-0 bottom-0 z-10 h-2 w-2 border-0 border-r border-b border-transparent group-hover:border-brand-ivory-300"></div>
                            <span class="absolute top-1 left-2 text-[12px] font-semibold">E</span>
                            <span class="absolute bottom-0.5 right-2 text-[12px] font-semibold">P</span>  
                            <span class="absolute top-2 right-4 h-1 w-1 bg-brand-navy-200  group-hover:bg-brand-steel-200 transition-colors duration-100"></span>
                            <span class="absolute top-2 right-2 h-1 w-1 bg-brand-golden-300/50 group-hover:bg-brand-golden-200 transition-colors duration-500"></span>
                            <span class="absolute top-4 right-2 h-1 w-1 bg-brand-ivory-300/50 group-hover:bg-brand-ivory-300 transition-colors duration-900"></span>
                            <span class="absolute transform -translate-x-5 bottom-1.5 left-2 h-1 w-2.5 border-t border-brand-ivory-300/0 group-hover:border-brand-golden-100 group-hover:translate-x-0 transition-all duration-500"></span>
                            <span class="absolute transform -translate-x-4 bottom-0.5 left-2 h-1 w-2 border-t border-brand-ivory-300/0 group-hover:border-brand-golden-100 group-hover:translate-x-0 transition-all duration-900"></span>
                        </div>

                        <span class="text-brand-golden-300">{{ 'Euclides' | uppercase }}</span>
                    </div>
                </div>
                <button
                (click)="toggleSidebar()"
                    class="text-brand-golden-300 hover:text-brand-golden-300 cursor-pointer transition-colors duration-500 p-2 rounded-sm border border-brand-golden-300/20 hover:border-brand-golden-300/60">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 32 32">
                        <path d="M0 0h32v32H0z" fill="none" stroke-width="4" />
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="6"
                            stroke-linejoin="round" stroke-width="2" d="M2 30L30 2m0 28L2 2" />
                    </svg>
                </button>
            </div>
            <nav class="ep-sidebar__nav flex-1 overflow-y-auto py-2 space-y-2 px-4">
                    <ul
                        class="ep-sidebar__nav__list h-full border border-brand-golden-300/20 p-4 flex gap-4 flex-col overflow-y-auto ">
                        @for (route of routes(); track route.path; let index = $index) {
                        <li class="
                            sidebar__nav__item
                            group
                            w-full
                            border
                            border-brand-golden-300/20
                            p-3
                            text-brand-golden-100/40
                            hover:text-brand-golden-300
                            hover:border-brand-golden-300
                            transition-colors
                            duration-500
                            cursor-pointer
                            text-[12px]
                            md:text-sm
                            " 
                            [routerLink]="['/euclides/',route.path]" routerLinkActive="sidebar__item-active"
                            [routerLinkActiveOptions]="{exact:true}"
                            (click)="toggleSidebar()"
                            >
                            <div class="w-full flex gap-4 items-center justify-start font-space">
                                <span class="item__number tracking-[.2em] transition-colors duration-500 text-brand-golden-1    00/30 group-hover:text-brand-golden-300">
                                    <span>0{{index + 1}}</span>
                                    <span>.</span>
                                </span>
                                <span class="font-inter">
                                    {{route.label | uppercase}}
                                </span>
    
                            </div>
                        </li>
                        }
                    </ul>
            </nav>
            <div class="ep-sidebar__footer">
                <section class="w-full  px-4    ">
                    <div class="border border-brand-golden-300/20 w-full p-4">
                        <div class="flex justify-center items-center gap-4 mb-4">
                            <a href="https://www.linkedin.com/in/e-perez-in/"
                                class="p-2 border border-brand-golden-400/20 text-center text-[12px] font-code flex items-center justify-center hover:text-brand-golden-300 hover:border-brand-golden-300 gap-4 transition-colors duration-500">
    
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-brand-golden-300"
                                    viewBox="0 0 24 24">
                                    <path d="M0 0h24v24H0z" fill="none" />
                                    <path fill="currentColor"
                                        d="M18.44 3.06H5.56a2.507 2.507 0 0 0-2.5 2.5v12.88a2.507 2.507 0 0 0 2.5 2.5h12.88a2.5 2.5 0 0 0 2.5-2.5V5.56a2.5 2.5 0 0 0-2.5-2.5m1.5 15.38a1.51 1.51 0 0 1-1.5 1.5H5.56a1.51 1.51 0 0 1-1.5-1.5V5.56a1.51 1.51 0 0 1 1.5-1.5h12.88a1.51 1.51 0 0 1 1.5 1.5Z" />
                                    <path fill="currentColor" d="M6.376 10.748a1 1 0 1 1 2 0v6.5a1 1 0 0 1-2 0Z" />
                                    <circle cx="7.376" cy="6.744" r="1" fill="currentColor" />
                                    <path fill="currentColor"
                                        d="M17.62 13.37v3.88a1 1 0 1 1-2 0v-3.88a1.615 1.615 0 1 0-3.23 0v3.88a1 1 0 0 1-2 0v-6.5a1.016 1.016 0 0 1 1-1a.94.94 0 0 1 .84.47a3.61 3.61 0 0 1 5.39 3.15" />
                                </svg>
                            </a>
                            <a href="https://github.com/euclidesseg"
                                class="p-2 border border-brand-golden-400/20 text-center text-[12px] font-code flex items-center justify-center hover:text-brand-golden-300 hover:border-brand-golden-300 gap-4 transition-colors duration-500">
    
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-brand-golden-300"
                                    viewBox="0 0 24 24">
                                    <path d="M0 0h24v24H0z" fill="none" />
                                    <g fill="none" stroke="currentColor" stroke-linecap="round"
                                        stroke-linejoin="round" stroke-width="1.5">
                                        <path d="M10 20.568c-3.429 1.157-6.286 0-8-3.568" />
                                        <path
                                            d="M10 22v-3.242c0-.598.184-1.118.48-1.588c.204-.322.064-.78-.303-.88C7.134 15.452 5 14.107 5 9.645c0-1.16.38-2.25 1.048-3.2c.166-.236.25-.354.27-.46c.02-.108-.015-.247-.085-.527c-.283-1.136-.264-2.343.16-3.43c0 0 .877-.287 2.874.96c.456.285.684.428.885.46s.469-.035 1.005-.169A9.5 9.5 0 0 1 13.5 3a9.6 9.6 0 0 1 2.343.28c.536.134.805.2 1.006.169c.2-.032.428-.175.884-.46c1.997-1.247 2.874-.96 2.874-.96c.424 1.087.443 2.294.16 3.43c-.07.28-.104.42-.084.526s.103.225.269.461c.668.95 1.048 2.04 1.048 3.2c0 4.462-2.134 5.807-5.177 6.643c-.367.101-.507.559-.303.88c.296.47.48.99.48 1.589V22" />
                                    </g>
                                </svg>
                            </a>
                        </div>
                        <a [routerLink]="['/euclides/','cv']" class="ep-sidebar__footer__cv group">
                            <div
                                class="flex uppercase gap-2 items-center justify-center relative z-9 h-full w-full">
                                <span>
                                    Ver CV
                                </span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6  h-4" viewBox="0 0 1024 1024">
                                    <path d="M0 0h1024v1024H0z" fill="none" />
                                    <path fill="currentColor"
                                        d="M505.7 661a8 8 0 0 0 12.6 0l112-141.7c4.1-5.2.4-12.9-6.3-12.9h-74.1V168c0-4.4-3.6-8-8-8h-60c-4.4 0-8 3.6-8 8v338.3H400c-6.7 0-10.4 7.7-6.3 12.9zM878 626h-60c-4.4 0-8 3.6-8 8v154H214V634c0-4.4-3.6-8-8-8h-60c-4.4 0-8 3.6-8 8v198c0 17.7 14.3 32 32 32h684c17.7 0 32-14.3 32-32V634c0-4.4-3.6-8-8-8" />
                                </svg>
                            </div>
    
                        </a>
                    </div>
                </section>
            </div>
        </header>
    
    </aside>
}

<header class="ep-header fixed w-full top-0 left-0 right-0 z-100 px-1 xl:px-8 pt-3 pb-3">
  <nav
    class="ep-header__nav px-4 w-full max-w-6xl mx-auto h-14 flex items-center justify-between py-2 bg-brand-navy-300/70 backdrop-blur-xl border border-brand-golden-200/10 rounded-lg shadow-[0_8px_32px_rgba(0,0,0,0.25)]">

    <a [routerLink]="'/about'" routerLinkActive="border-b-2" [routerLinkActiveOptions]="{ exact: true }"
      class="relative text-brand-golden-300 flex gap-2 items-center font-medium h-full text-[12px] sm:text-sm text-nowrap transition-colors duration-300 hover:text-brand-golden-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="currentColor"
          d="M12 1.5C6.201 1.5 1.5 6.201 1.5 12S6.201 22.5 12 22.5S22.5 17.799 22.5 12S17.799 1.5 12 1.5M2.5 12a9.5 9.5 0 1 1 16.4 6.53a4.64 4.64 0 0 0-1.219-2.381c-.743-.774-1.679-1.228-2.501-1.484c-.527-.164-1.037.023-1.39.26c-.383.259-1.013.575-1.79.575s-1.407-.316-1.79-.574c-.353-.239-.863-.425-1.39-.261c-.822.256-1.758.71-2.501 1.484a4.64 4.64 0 0 0-1.22 2.38A9.47 9.47 0 0 1 2.5 12m3.505 7.37c.056-1.14.476-1.947 1.035-2.528c.59-.615 1.36-.999 2.078-1.223c.128-.04.319-.009.533.136c.477.322 1.302.745 2.349.745s1.872-.423 2.349-.745c.214-.145.405-.176.533-.136c.719.224 1.487.608 2.078 1.223c.559.58.979 1.389 1.035 2.528A9.46 9.46 0 0 1 12 21.5a9.46 9.46 0 0 1-5.995-2.13M9.5 10c0-1.385 1.08-2.5 2.5-2.5s2.5 1.115 2.5 2.5s-1.08 2.5-2.5 2.5s-2.5-1.114-2.5-2.5M12 6.5A3.47 3.47 0 0 0 8.5 10c0 1.928 1.519 3.5 3.5 3.5s3.5-1.572 3.5-3.5s-1.519-3.5-3.5-3.5" />
      </svg>

      <span>{{ 'Euclides' | uppercase }}</span>
    </a>

    <div class="hidden lg:block">
      @for (route of routes(); track route.path) {
      <a [routerLink]="route.path" routerLinkActive="border-b-2 border-brand-golden-300 text-brand-golden-300"
        [routerLinkActiveOptions]="{ exact: true }"
        class="ep-nav__item  px-3 py-1.5 text-[11px] font-medium uppercase tracking-[0.12em] transition-all relative hover:text-brand-golden-200 ">
        <span>{{ route.label | uppercase }}</span>
      </a>
      }
    </div>

    <div class="flex items-center justify-center gap-4">
      <a routerLink="/cv"
        class="text-brand-golden-300 bg-brand-navy-200 border backdrop-blur-2xl border-brand-golden-300/10 hover:bg-brand-golden-100/20 tracking-widest transition-colors duration-500 text-[9px] sm:text-[12px] flex items-center p-2 sm:p-3 rounded-lg font-bold justify-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4  h-4" viewBox="0 0 1024 1024">
          <path d="M0 0h1024v1024H0z" fill="none" />
          <path fill="currentColor"
            d="M505.7 661a8 8 0 0 0 12.6 0l112-141.7c4.1-5.2.4-12.9-6.3-12.9h-74.1V168c0-4.4-3.6-8-8-8h-60c-4.4 0-8 3.6-8 8v338.3H400c-6.7 0-10.4 7.7-6.3 12.9zM878 626h-60c-4.4 0-8 3.6-8 8v154H214V634c0-4.4-3.6-8-8-8h-60c-4.4 0-8 3.6-8 8v198c0 17.7 14.3 32 32 32h684c17.7 0 32-14.3 32-32V634c0-4.4-3.6-8-8-8" />
        </svg>
        <span>
          CV
        </span>
      </a>
      <button (click)="toggleSidebar()"
        class="text-brand-golden-300 cursor-pointer lg:hidden bg-brand-navy-200 border backdrop-blur-2xl border-brand-golden-300/10 hover:bg-brand-golden-100/20 tracking-widest transition-colors duration-500 text-[9px] sm:text-[12px] flex items-center p-2 sm:p-3 rounded-lg font-bold justify-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" viewBox="0 0 24 24">
          <path d="M0 0h24v24H0z" fill="none" />
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 6h14M5 12h14M5 18h14" />
        </svg>

      </button>
    </div>

  </nav>
</header>
